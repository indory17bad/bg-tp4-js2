<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<title>CRUD-Persons</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="table_container">
		<table id="table_persons">
			<tr>
				<th class="col_number">N°</th>
				<th class="col_text">Name</th>
				<th class="col_text">firstName</th>
				<th class="col_number">Points</th>
				<th class="col_chkbox">Select</th>
			</tr>
			<tr>
				<td class="col_number">1</td>
				<td class="col_text">Name1</td>
				<td class="col_text">firstName1</td>
				<td class="col_number">5</td>
				<td class="col_chkbox"><input type="checkbox"/></td>
			</tr>
			<tr>
				<td class="col_number">2</td>
				<td class="col_text">Name2</td>
				<td class="col_text">firstName2</td>
				<td class="col_number">10</td>
				<td class="col_chkbox"><input type="checkbox"/></td>
			</tr>
			<tr>
				<td class="col_number">3</td>
				<td class="col_text">Name3</td>
				<td class="col_text">firstName3</td>
				<td class="col_number">15</td>
				<td class="col_chkbox"><input type="checkbox"/></td>
			</tr>
		</table>
	</div>
</body>
</html>
