<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<title>CRUD-Persons</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="table_container">
		<div id="form_container">
			<div class="form_group">
				<label class="form_label">Name:</label>
				<input type="text" id="form_Name" class="form_field"/>
			</div>
			<div class="form_group">
				<label class="form_label">PréName:</label>
				<input type="text" id="form_preName" class="form_field"/>
			</div>
			<div class="form_group">
				<label class="form_label">Points:</label>
				<input type="number" id="form_points" class="form_field"/>
			</div>
			<button onclick="doNewData()">Ajouter</button>
		</div>
		<table id="table_persons">
			<tr>
				<th class="col_number">N°</th>
				<th class="col_text">Name</th>
				<th class="col_text">PréName</th>
				<th class="col_number">Points</th>
				<th class="col_chkbox">Select</th>
			</tr>
		</table>
		<div id="container_summary">
			<p id="p1">0 ligne(s)</p>
			<p id="p2"></p>
			<p id="p3">Total point(s)= 0</p>
		</div>
		<button onclick="consoleTableau()">Console Tableau</button>
	</div>
	<script src="script.js"></script>
</body>
</html>
